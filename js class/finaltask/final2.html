<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .products {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        padding: 16px;
    }
    .product {
        border: 1px solid #ccc;
        padding: 16px;
        width: calc(33% - 32px);
    }
</style>
<body>
   
<p id="msg">Loading...</p>

<script>
fetch("https://fakestoreapi.com/products")
 .then((jsonData)=>{
     return jsonData.json();
 })
 .then((Data)=>{
      console.log(Data);
    let msg =  document.getElementById("msg")
    Data.forEach((c,i,t)=>{
 msg.innerHTML=`Data: ${JSON.stringify(Data)} 
    <h2>title:${c.title}</h2>;
    <img src="${c.image}" alt="Image of ${c.title}">
    <h5>description:${c.description}</h5>
    <h3>price:${c.price}</h3>`
    
    })
   
})
</script>
</body>
</html>
