<!DOCTYPE html>
<html>
<head>
  <title>Cart Total</title>
</head>

<body>

  <h3>
    Shirt - $100
    <button onclick="addToCart('Shirt',100)">
      Add
    </button>
  </h3>

  <h3>
    Shoes - $200
    <button onclick="addToCart('Shoes',200)">
      Add
    </button>
  </h3>

  <h3>
    Watch - $150
    <button onclick="addToCart('Watch',150)">
      Add
    </button>
  </h3>

  <h2>
    Cart Count:
    <span id="count">0</span>
  </h2>

  <h2>
    Total:
    $<span id="total">0</span>
  </h2>

  <script>

    let cart = [];
    let total = 0;

    function addToCart(product, price) {

      // store item
      cart.push({
        name: product,
        price: price
      });

      // increase total
      total = total + price;

      // update count
      document.getElementById("count").innerText =
        cart.length;

      // update total
      document.getElementById("total").innerText =
        total;

      console.log(cart);
    }

  </script>

</body>
</html>
